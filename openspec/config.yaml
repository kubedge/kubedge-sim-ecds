schema: spec-driven

context: |
  Role: CONSUMER in the kubedge SIMULATOR family — the ECDS simulator, and the FIRST
  kubesim_base customer to bring fully working. Plain Go app (LIGHT on Kubernetes; it does
  not talk to the API server). Builds five component binaries under cmd/: platform,
  frontend, enrichment, businesslogic, loadbalancer (each with a build tag `-tags=<component>`).

  Two dependency directions (Notes 15-16):
    - Compile-time (go.mod): consumes github.com/kubedge/kubesim_base sub-modules
      config + connected + grpc/go. CURRENT pin v0.1.24 → REALIGN to **v0.1.25** (kubesim_base
      cut the v0.1.25 multi-module tag: config/connected/grpc/go all at v0.1.25).
    - Runtime/deploy: these five components are DEPLOYED BY kubedge-operator-ecds. Its
      ECDSCluster CR fields (Platforms/FrontEnds/Enrichments/BusinessLogics/LoadBalancers)
      reference these images: hack4easy/ecds-<component>:v<VERSION>. Keep the image names in
      sync with what operator-ecds's example CR expects.

  Build / images:
    - go currently 1.20. Images currently arch-suffixed (IMG_<C>_{DEV,AMD64,ARM64V8,ARM32V7},
      VERSION_V1=0.2.24) with a 25-Dockerfile per-arch explosion. MODERNIZE to buildx.
    - GOOD NEWS: multi-stage, TARGETARCH-aware, distroless Dockerfiles ALREADY EXIST at
      build/Dockerfile.ecds-<component>.buildkit — promote those; don't write new ones.
    - Per Note 18: buildx is the sole go-forward path; **comment out (retire, don't delete)**
      the plain + per-arch Dockerfiles, the arch-suffixed IMG_* vars, and the per-arch
      docker-build targets — marked `# RETIRED: superseded by docker-buildx`.

  FASTEST PATH TO A WORKING SIM (compile → images):
    1. realign-to-kubesim-base → go get config/connected/grpc-go @v0.1.25; go mod tidy; go build ./... green.
       (kubesim_base v0.1.25 was cut with go 1.26 — this repo must be on go >= 1.26 to consume it.)
    2. go-version-bump → raise go directive 1.20 → **1.26** (FLEET-CONSISTENT: operators + kubesim_base all
       went to 1.26; do NOT pick 1.23). Also bump the .buildkit Dockerfiles' builder golang:1.23 → golang:1.26.
       CRITICAL COUPLING: the class-M ci.yml ships golangci-lint v1.61.0 (action@v6), which CANNOT lint a
       go 1.26 module ("go version used to build golangci-lint is lower than targeted") — bump the CI job to
       golangci-lint **v2.12.2** + **golangci-lint-action@v8**. Raising go without this = red CI.
    3. buildx-multiarch-components → colima start; per component
       `docker buildx build --platform linux/arm64,linux/amd64 -f build/Dockerfile.ecds-<component>.buildkit
        -t hack4easy/ecds-<component>:v${VERSION} --push .`; drop arch suffixes; VERSION_V1→VERSION.
    4. coordinate: update operator-ecds's example CR image refs to the arch-independent
       hack4easy/ecds-<component>:v<ver> — then operator-ecds can deploy this sim.
    5. then: adopt-go-ci, test-coverage.

  Components: platform, frontend, enrichment, businesslogic, loadbalancer (cmd/<component>/main.go,
  build tag -tags=<component>). Image base: hack4easy/ecds-<component>.

rules:
  spec:
    - Describe CURRENT behavior; do not spec aspirational features.
    - Keep image names in sync with the paired operator-ecds CR.
